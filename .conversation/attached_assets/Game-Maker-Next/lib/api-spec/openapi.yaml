openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: friends
    description: Friends management
  - name: messages
    description: Messaging
  - name: games
    description: Game history and scores

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /friends:
    get:
      operationId: getFriends
      tags: [friends]
      summary: Get friends list
      responses:
        "200":
          description: List of friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendUser"
    post:
      operationId: addFriend
      tags: [friends]
      summary: Add a friend by username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFriendInput"
      responses:
        "200":
          description: Friend added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendUser"
        "404":
          description: User not found

  /friends/{id}:
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Friend removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /users/search:
    get:
      operationId: searchUsers
      tags: [friends]
      summary: Search users by username
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchResult"

  /messages/conversations:
    get:
      operationId: getConversations
      tags: [messages]
      summary: Get all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /messages/{username}:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get messages with a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message to a user
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /games/history:
    get:
      operationId: getGameHistory
      tags: [games]
      summary: Get game history for current user
      responses:
        "200":
          description: Game history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameHistoryEntry"
    post:
      operationId: recordGameHistory
      tags: [games]
      summary: Record a game play
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameHistoryInput"
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameHistoryEntry"

  /games/leaderboard/{gameId}:
    get:
      operationId: getLeaderboard
      tags: [games]
      summary: Get global leaderboard for a game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    UserInfo:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
      required: [id, username]

    AuthResponse:
      type: object
      properties:
        user:
          type: ["object", "null"]
          properties:
            id:
              type: integer
            username:
              type: string

    FriendUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string

    AddFriendInput:
      type: object
      required: [username]
      properties:
        username:
          type: string

    UserSearchResult:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string

    Conversation:
      type: object
      required: [username, lastMessage, updatedAt]
      properties:
        username:
          type: string
        lastMessage:
          type: string
        updatedAt:
          type: string

    Message:
      type: object
      required: [id, fromUserId, toUserId, content, createdAt, fromUsername, toUsername]
      properties:
        id:
          type: integer
        fromUserId:
          type: integer
        toUserId:
          type: integer
        content:
          type: string
        createdAt:
          type: string
        fromUsername:
          type: string
        toUsername:
          type: string

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string

    GameHistoryEntry:
      type: object
      required: [id, gameId, playedAt]
      properties:
        id:
          type: integer
        gameId:
          type: string
        score:
          type: ["integer", "null"]
        playedAt:
          type: string

    GameHistoryInput:
      type: object
      required: [gameId]
      properties:
        gameId:
          type: string
        score:
          type: ["integer", "null"]

    LeaderboardEntry:
      type: object
      required: [username, score, rank]
      properties:
        username:
          type: string
        score:
          type: integer
        rank:
          type: integer
